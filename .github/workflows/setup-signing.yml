name: Set up ONE MORE FLOOR signing

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Copy stable debug signing key
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/simplebusiness26/OneMore.git /tmp/onemore
          mkdir -p .github
          cp /tmp/onemore/.github/one-more-floor-debug.keystore.b64 .github/one-more-floor-debug.keystore.b64
          rm -f .github/workflows/setup-signing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add stable One More Floor debug signing key"
          git push

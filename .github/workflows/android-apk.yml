name: Build ONE MORE FLOOR Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - build-status.txt

permissions:
  contents: write

concurrency:
  group: one-more-floor-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        run: node --check game.js
      - name: Prepare web bundle
        run: |
          rm -rf dist android
          mkdir -p dist/icons
          cp index.html styles.css game.js manifest.webmanifest sw.js dist/
          cp icons/icon.svg dist/icons/
      - name: Create and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/one-more-floor-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          echo "33c130fbab855317613c1c24a447064619102be50c448b4092a6b4e5c997baf4  $HOME/.android/debug.keystore" | sha256sum -c -
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk one-more-floor-debug.apk
          test -s one-more-floor-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: one-more-floor-debug-apk
          path: one-more-floor-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view one-more-floor-latest >/dev/null 2>&1; then
            gh release upload one-more-floor-latest one-more-floor-debug.apk --clobber
          else
            gh release create one-more-floor-latest one-more-floor-debug.apk --title "ONE MORE FLOOR Android APK" --notes "Latest installable debug APK for ONE MORE FLOOR."
          fi
